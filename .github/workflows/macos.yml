name: macOS DMG
on:
  push:
    branches: [main, 'build/v0.2.0-20261103']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ECP_PROFILE_SCROLL_OUTPUT: ${{ github.workspace }}/artifacts/audit/profile-scroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare audit directory
        run: |
          mkdir -p artifacts/audit
          git rev-parse HEAD > artifacts/audit/source-commit.txt
      - name: Check official DeepSeek windows and Chinese holidays
        run: dotnet run --project Tests/DeepSeekPeriodTests.csproj -c Release
      - name: Build native collectors
        run: bash scripts/build-native.sh '${{ matrix.rid }}'
      - name: Prepare isolated CI Keychain
        run: |
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ecp-test.keychain-db"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ecp-test.keychain-db"
      - name: Test profile editing scroll position
        timeout-minutes: 3
        run: |
          set -o pipefail
          dotnet run --project Tests/ProfileScrollTests.csproj -c Release 2>&1 | tee artifacts/audit/profile-scroll.log
      - name: Test platform update checks and reminders
        timeout-minutes: 3
        run: |
          set -o pipefail
          dotnet run --project Tests/UpdateTests.csproj -c Release -- zmd-charge-plus-for-macos 2>&1 | tee artifacts/audit/update.log
      - name: Test hot-zone and trigger rule interactions
        timeout-minutes: 3
        run: |
          set -o pipefail
          dotnet run --project Tests/TriggerTests.csproj -c Release 2>&1 | tee artifacts/audit/triggers.log
      - name: Test collectors, every local variable, profiles and native UI
        timeout-minutes: 5
        run: |
          set -o pipefail
          dotnet run --project Tests/EndfieldChargePlus.PlatformTests.csproj -c Release 2>&1 | tee artifacts/audit/platform.log
      - name: Test Save and Apply in a fresh macOS home
        timeout-minutes: 3
        run: |
          test_home=$(mktemp -d "$RUNNER_TEMP/ecp-test-home.XXXXXX")
          HOME="$test_home" ECP_TEST_HOME="$test_home" dotnet Tests/bin/Release/net8.0/EndfieldChargePlus.PlatformTests.dll --settings-save-only
      - name: Test language switches and supported UI scales
        timeout-minutes: 8
        env:
          ECP_LAYOUT_OUTPUT: ${{ github.workspace }}/artifacts/audit/language-layout
        run: |
          set -o pipefail
          dotnet run --project Tests/LanguageLayoutTests.csproj -c Release 2>&1 | tee artifacts/audit/language-layout.log
      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash scripts/package-macos.sh '${{ matrix.rid }}' "${GITHUB_REF_NAME#v}"
          else
            bash scripts/package-macos.sh '${{ matrix.rid }}'
          fi
      - name: Verify DMG and run packaged app
        run: bash scripts/verify-dmg.sh '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.rid }}
          path: |
            artifacts/packages/*
            artifacts/audit/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true
      - name: Publish both validated architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.dmg artifacts/packages/*.sha256 --title "Endfield Charge Plus For MacOS $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
