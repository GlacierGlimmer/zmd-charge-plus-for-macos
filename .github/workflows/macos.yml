name: macOS DMG
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build native collectors
        run: bash scripts/build-native.sh '${{ matrix.rid }}'
      - name: Prepare isolated CI Keychain
        run: |
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ecp-test.keychain-db"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ecp-test.keychain-db"
      - name: Test collectors, every local variable, profiles and native UI
        run: dotnet run --project Tests/EndfieldChargePlus.PlatformTests.csproj -c Release
      - name: Build DMG
        run: bash scripts/package-macos.sh '${{ matrix.rid }}'
      - name: Verify DMG and run packaged app
        run: bash scripts/verify-dmg.sh '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.rid }}
          path: |
            artifacts/packages/*
            artifacts/audit/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts
          merge-multiple: true
      - name: Publish both validated architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.dmg artifacts/packages/*.sha256 --title "Endfield Charge Plus For MacOS $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
