name: macOS DMG
on:
  push:
    branches: [build/local-release-features-20261010]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: local-macos-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check official DeepSeek windows and Chinese holidays
        run: dotnet run --project Tests/DeepSeekPeriodTests.csproj -c Release
      - name: Build native collectors
        run: bash scripts/build-native.sh '${{ matrix.rid }}'
      - name: Verify real-frame native exports
        run: |
          nm -gU native/libecpmac.dylib | grep _ecp_frame_read
          nm -gU native/libecpmac.dylib | grep _ecp_frame_targets
          nm -gU native/libecpmac.dylib | grep _ecp_frames_keepalive
          nm -gU native/libecpmac.dylib | grep _ecp_frames_stop
      - name: Prepare isolated CI Keychain
        run: |
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ecp-test.keychain-db"
          security unlock-keychain -p "$password" "$RUNNER_TEMP/ecp-test.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ecp-test.keychain-db"
      - name: Test collectors, every local variable, profiles and native UI
        timeout-minutes: 5
        run: dotnet run --project Tests/EndfieldChargePlus.PlatformTests.csproj -c Release
      - name: Test Save and Apply in a fresh macOS home
        timeout-minutes: 3
        run: |
          test_home=$(mktemp -d "$RUNNER_TEMP/ecp-test-home.XXXXXX")
          HOME="$test_home" ECP_TEST_HOME="$test_home" dotnet Tests/bin/Release/net8.0/EndfieldChargePlus.PlatformTests.dll --settings-save-only
      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash scripts/package-macos.sh '${{ matrix.rid }}' "${GITHUB_REF_NAME#v}"
          else
            bash scripts/package-macos.sh '${{ matrix.rid }}'
          fi
      - name: Verify DMG and run packaged app
        run: bash scripts/verify-dmg.sh '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.rid }}
          path: |
            artifacts/packages/*
            artifacts/audit/*
          if-no-files-found: error
